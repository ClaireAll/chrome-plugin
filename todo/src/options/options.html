<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>todo</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="todo-options-shell">
      <div class="todo-options-dashboard">
        <div class="todo-options-content">
          <header class="todo-options-header">
            <div class="todo-options-brand">
              <img class="todo-options-logo" src="../../icons/icon-48.png" alt="" />
              <div>
                <h1>待办工作台</h1>
                <p class="todo-options-subtitle">专注完成每一件事，让进度看得见。</p>
              </div>
            </div>
          </header>
          <section class="todo-stats-grid" aria-label="完成概览">
            <article class="todo-stat-card todo-stat-card--blue">
              <span class="todo-stat-icon" aria-hidden="true">✓</span>
              <div class="todo-stat-copy">
                <span class="todo-stat-label">今日完成</span>
                <strong id="todayCompletedCount">0</strong>
                <span id="todayCompletedDelta" class="todo-stat-note">较昨日 0</span>
              </div>
            </article>
            <article class="todo-stat-card todo-stat-card--green">
              <span class="todo-stat-icon" aria-hidden="true">▣</span>
              <div class="todo-stat-copy">
                <span class="todo-stat-label">本周完成</span>
                <strong id="weekCompletedCount">0</strong>
                <span id="weekCompletionRate" class="todo-stat-note">活跃率 0%</span>
                <span class="todo-stat-progress" aria-hidden="true">
                  <span id="weekCompletionProgress"></span>
                </span>
              </div>
            </article>
            <article class="todo-stat-card todo-stat-card--purple">
              <span class="todo-stat-icon" aria-hidden="true">↗</span>
              <div class="todo-stat-copy">
                <span class="todo-stat-label">连续坚持</span>
                <strong><span id="streakDays">0</span> <small>天</small></strong>
                <span class="todo-stat-note">继续保持</span>
              </div>
            </article>
            <article class="todo-stat-card todo-stat-card--orange">
              <span class="todo-stat-icon" aria-hidden="true">≋</span>
              <div class="todo-stat-copy">
                <span class="todo-stat-label">平均每天</span>
                <strong id="averageDailyCount">0</strong>
                <span class="todo-stat-note">项 / 天</span>
              </div>
            </article>
          </section>
          <div class="todo-options-main">
            <section class="todo-options-primary" aria-labelledby="completedHeading">
              <div class="section-heading">
                <h2 id="completedHeading">最近完成记录</h2>
                <input id="completedSearch" type="search" placeholder="搜索任务" aria-label="搜索完成记录" />
              </div>
              <div id="completedList" class="completed-list"></div>
            </section>
            <div class="todo-options-lower">
              <section id="weeklySummary" class="todo-options-summary">
                <div class="section-heading">
                  <h2>周完成趋势</h2>
                  <div class="weekly-summary-actions">
                    <select id="weeklyWeekSelect" aria-label="选择有完成记录的周"></select>
                    <button class="chart-mode-button" type="button">按时段</button>
                  </div>
                </div>
                <div id="weeklyChart"></div>
              </section>
            </div>
          </div>
        </div>
        <aside class="todo-options-rail">
          <section class="options-section" aria-labelledby="storageHeading">
            <h2 id="storageHeading">数据文件</h2>
            <p class="section-subtitle">管理你的待办数据文件</p>
            <div class="file-status-card">
              <div class="file-status-copy">
                <div class="file-status-title-row">
                  <strong id="completedFileName">todo-completed.json</strong>
                  <span id="completedPermissionBadge" class="permission-badge">未授权</span>
                </div>
                <span id="completedFileStatus" class="status-text">未绑定完成记录文件</span>
              </div>
            </div>
            <div class="control-row">
              <button id="pickCompletedFile" type="button">更换文件</button>
              <button id="createCompletedFile" type="button">新建文件</button>
              <button id="requestCompletedPermission" type="button">权限管理</button>
            </div>
          </section>
          <section class="options-section" aria-labelledby="ballThemeHeading">
            <div class="section-heading">
              <h2 id="ballThemeHeading">主题设置</h2>
            </div>
            <label class="theme-color-control" for="ballThemeColor">
              <span>悬浮球</span>
              <input id="ballThemeColor" type="color" aria-label="选择小球主题色" />
            </label>
          </section>
          <section class="options-section scheduled-section" aria-labelledby="scheduledTaskHeading">
            <div class="section-heading">
              <h2 id="scheduledTaskHeading">定时任务</h2>
            </div>
            <p class="section-subtitle">设置自动提醒，养成规律习惯</p>
            <form id="scheduledTaskForm" class="scheduled-task-form">
              <label class="scheduled-field scheduled-field--wide">
                <span>任务名称</span>
                <input id="scheduledTaskText" type="text" autocomplete="off" placeholder="请输入任务名称" required />
              </label>
              <label class="scheduled-field">
                <span>重复</span>
                <select id="scheduledTaskFrequency" class="scheduled-frequency-select" required aria-label="重复粒度">
                  <option value="workday">日（工作日）</option>
                  <option value="weekly">周</option>
                  <option value="monthly">月</option>
                </select>
                <span class="scheduled-segmented" aria-label="重复粒度">
                  <button type="button" data-frequency="workday">每天</button>
                  <button type="button" data-frequency="weekly">每周</button>
                  <button type="button" data-frequency="monthly">每月</button>
                </span>
              </label>
              <label id="scheduledTaskWeekdayField" class="scheduled-field" hidden>
                <span>日期</span>
                <select id="scheduledTaskWeekday">
                  <option value="1">周一</option>
                  <option value="2">周二</option>
                  <option value="3">周三</option>
                  <option value="4">周四</option>
                  <option value="5">周五</option>
                  <option value="6">周六</option>
                  <option value="7">周日</option>
                </select>
              </label>
              <label id="scheduledTaskMonthdayField" class="scheduled-field" hidden>
                <span>日期</span>
                <select id="scheduledTaskMonthday"></select>
              </label>
              <label class="scheduled-field">
                <span>时间</span>
                <input id="scheduledTaskTime" type="time" value="09:00" required />
              </label>
              <button type="submit">添加任务</button>
            </form>
            <div id="scheduledTaskList" class="scheduled-task-list"></div>
          </section>
          <section class="todo-theme-preview todo-rail-theme-preview" aria-labelledby="colorHeading">
            <div class="section-heading">
              <h2 id="colorHeading">主题颜色预览</h2>
              <button id="addColorPreset" class="theme-manage-button" type="button">添加颜色</button>
            </div>
            <p class="theme-preview-label">点击色块可调整颜色，当前预览色会显示对勾。</p>
            <div id="colorPresetList" class="color-preset-list"></div>
          </section>
        </aside>
      </div>
    </main>
    <script src="../../vendor/echarts.min.js"></script>
    <script type="module" src="options.js"></script>
  </body>
</html>
