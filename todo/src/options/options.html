<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>todo</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="todo-options-shell">
      <header class="todo-options-header">
        <p class="todo-options-kicker">Todo workspace</p>
        <h1>待办工作台</h1>
        <p class="todo-options-subtitle">完成记录、颜色预设与本周节奏。</p>
      </header>
      <div class="todo-options-workspace">
        <section class="todo-options-primary" aria-labelledby="completedHeading">
          <div class="section-heading">
            <h2 id="completedHeading">完成记录</h2>
            <input id="completedSearch" type="search" placeholder="搜索任务" aria-label="搜索完成记录" />
          </div>
          <div id="completedList" class="completed-list"></div>
        </section>
        <aside class="todo-options-rail">
          <section class="options-section" aria-labelledby="storageHeading">
            <h2 id="storageHeading">完成记录文件</h2>
            <div class="control-row">
              <button id="pickCompletedFile" type="button">选择文件</button>
              <button id="createCompletedFile" type="button">新建文件</button>
              <button id="requestCompletedPermission" type="button">请求权限</button>
              <span id="completedFileStatus" class="status-text"></span>
            </div>
          </section>
          <section class="options-section" aria-labelledby="ballThemeHeading">
            <div class="section-heading">
              <h2 id="ballThemeHeading">小球主题色</h2>
            </div>
            <label class="theme-color-control" for="ballThemeColor">
              <span>悬浮球</span>
              <input id="ballThemeColor" type="color" aria-label="选择小球主题色" />
            </label>
          </section>
          <section class="options-section" aria-labelledby="colorHeading">
            <div class="section-heading">
              <h2 id="colorHeading">颜色预设</h2>
              <button id="addColorPreset" type="button">添加颜色</button>
            </div>
            <div id="colorPresetList" class="color-preset-list"></div>
          </section>
        </aside>
      </div>
      <section id="weeklySummary" class="todo-options-summary">
        <h2>本周完成</h2>
        <div id="weeklyChart"></div>
      </section>
    </main>
    <script src="../../vendor/echarts.min.js"></script>
    <script type="module" src="options.js"></script>
  </body>
</html>
